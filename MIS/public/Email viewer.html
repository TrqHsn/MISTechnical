<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Viewer</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--text:#1d2330;--muted:#5b6575;--accent:#0f5ea8;--border:#dde2ea;--warn:#7a5200;--warnbg:#fff6e0;--err:#9b1c1c;--errbg:#fdeaea}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{background:var(--accent);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand{font-size:18px;font-weight:600}
.fmts span{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;margin-left:6px;font-size:12px;font-family:Consolas,monospace}
main{max-width:1200px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.drop{background:var(--card);border:2px dashed var(--border);border-radius:10px;padding:12px 16px;text-align:center;transition:.15s}
.drop.over{border-color:var(--accent);background:#eaf3fc}
.drop-title{font-size:15px;font-weight:600;margin-bottom:6px}
.drop .btn{margin-top:0;padding:7px 16px;font-size:13px}
.muted{color:var(--muted);font-size:13px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer;margin-top:12px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:#b9c3d0;cursor:not-allowed}
.btn-sm{padding:6px 12px;margin:0;font-size:13px;white-space:nowrap}
.status{padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:14px}
.status.error{background:var(--errbg);color:var(--err);border-color:#f2c4c4}
.status.warn{background:var(--warnbg);color:var(--warn);border-color:#f0d89a}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.filebar{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.filebar strong{word-break:break-all}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.subj{font-size:22px;margin:0 0 14px;word-break:break-word}
dl.meta{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:14px}
dl.meta dt{color:var(--muted);font-weight:600}
dl.meta dd{margin:0;word-break:break-word}
.warns{display:flex;flex-direction:column;gap:6px}
.warn-item{background:var(--warnbg);color:var(--warn);border:1px solid #f0d89a;border-radius:8px;padding:8px 12px;font-size:13px}
.frame{width:100%;height:86vh;min-height:448px;border:1px solid var(--border);border-radius:10px;background:#fff}
h2{font-size:16px;margin:0 0 10px}
.atts{list-style:none;padding:0;margin:0}
.att{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.att:last-child{border-bottom:0}
.att-info{min-width:0}
.att-name{font-weight:600;word-break:break-all}
.att-meta{color:var(--muted);font-size:12px;margin-top:2px}
.att-note{color:var(--warn);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;background:#e7eef8;color:var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
@media (max-width:600px){dl.meta{grid-template-columns:1fr}dl.meta dt{margin-top:6px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">&#9993; Offline Email Viewer - MIS Technical Team</div>
  <div class="fmts"><span>.eml</span><span>.msg</span><span>.oft</span></div>
</header>
<main>
  <div id="drop" class="drop" tabindex="0" role="button" aria-label="Drop an email file here or press Enter to browse">
    <div class="drop-title">Drop an email file here</div>
    <button id="browse" class="btn" type="button">Browse files</button>
    <input id="file" type="file" accept=".eml,.msg,.oft,message/rfc822" hidden>
  </div>
  <div id="status" class="status" hidden></div>
  <div id="fileBar" class="filebar" hidden><strong id="fname"></strong><span id="fmeta" class="muted"></span></div>
  <div id="empty" class="card empty">No email open. Choose a file above to view it.</div>
  <section id="viewer" hidden>
    <div class="card">
      <h1 id="subj" class="subj"></h1>
      <dl class="meta">
        <dt>From</dt><dd id="from"></dd>
        <dt>To</dt><dd id="to"></dd>
        <dt>CC</dt><dd id="cc"></dd>
        <dt>BCC</dt><dd id="bcc"></dd>
        <dt>Sent</dt><dd id="date"></dd>
      </dl>
    </div>
    <div id="warn" class="warns" hidden></div>
    <iframe id="frame" class="frame" title="Email body" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
    <section class="card" style="margin-top:16px">
      <h2>Attachments (<span id="acount">0</span>)</h2>
      <ul id="atts" class="atts"></ul>
    </section>
  </section>
  <p>Developed by MIS Technical Team</p>
</main>

  else if (cls && !/^IPM\.(Note|Post)/i.test(cls)) w.push(`This item is type "${cls}". Only mail fields are shown, so some content may be missing.`);
  if (fmt === 'oft') w.push('This is an Outlook template (.oft); its content is shown as a message.');
  const addr = (ids, q) => ids.map(i => S(q, i, cs)).find(a => a && !a.startsWith('/')) || '';
  const from = fa(S(P, 0x0C1A, cs) || S(P, 0x0042, cs), addr([0x5D01, 0x39FE, 0x0C1F, 0x65], P));
  const rec = [...R.c].filter(([k]) => k.startsWith('__recip_version1.0_')).sort(byKey)
    .map(([, n]) => { const q = props(n, 8, rd); return {t: I(q, 0x0C15) || 1, x: fa(S(q, 0x3001, cs), addr([0x39FE, 0x3003], q))}; });
  const j = t => rec.filter(r => r.t === t && r.x).map(r => r.x).join(', ');
  const to = j(1) || S(P, 0x0E04, cs) || '', cc = j(2) || S(P, 0x0E03, cs) || '', bcc = j(3) || S(P, 0x0E02, cs) || '';
  const dt = T(P, 0x39) || T(P, 0xE06);
  const th = S(P, 0x7D, cs);
  const M = {subject: S(P, 0x37, cs) || S(P, 0xE1D, cs) || '', from, to, cc, bcc,
    date: fdate(dt || (th && hdrs(th).get('date')) || ''), html: null, text: S(P, 0x1000, cs), atts: [], cid: new Map()};
  const hp = P.get(0x1013);
  if (hp && hp.d) M.html = hp.t === 0x1F ? S(P, 0x1013, cs) : dec(hp.d, cs || sniff(hp.d), w);
  for (const [, n] of [...R.c].filter(([k]) => k.startsWith('__attach_version1.0_')).sort(byKey)) {
    const q = props(n, 8, rd), dp = q.get(0x3701), method = I(q, 0x3705) ?? 1;
    const nm = S(q, 0x3707, cs) || S(q, 0x3704, cs) || '';
    const mime = S(q, 0x370E, cs) || '';
    const cid = (S(q, 0x3712, cs) || '').replace(/^<|>$/g, '').trim().toLowerCase() || null;
    const data = method === 1 && dp && dp.d ? dp.d : null;
    let note = '';
    if (method === 1 && !data) note = dp && dp.emb ? 'Embedded Outlook item: its content cannot be extracted in this viewer.' : 'Attachment content is missing from the file.';
    else if (method === 5) note = 'Embedded Outlook item: its content cannot be extracted in this viewer.';
    else if (method !== 1) note = 'Linked attachment: the file itself is not stored in this item.';
    M.atts.push({name: cname(nm), mime, data, size: data ? data.length : (I(q, 0xE20) || 0), inline: !!cid, cid, embedded: !!(dp && dp.emb), note});
    if (data && cid) M.cid.set(cid, 'data:' + (mime || 'application/octet-stream') + ';base64,' + b64(data));
  }
  if (M.html === null && M.text === null) w.push(P.has(0x1009) ? 'This item has only a compressed RTF body, which this viewer cannot render.' : 'No text or HTML body was found in this item.');
  M.warnings = w;
  return M;
}

function detect(ext, u) {
  if (u.length >= 8 && [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1].every((x, i) => u[i] === x)) return ext === 'oft' ? 'oft' : 'msg';
  if (ext === 'msg' || ext === 'oft') throw new Error(`The .${ext} file is not a valid Outlook item.`);
  if (ext === 'eml') return 'eml';
  return /^(Return-Path|Received|From|Date|Subject|MIME-Version|Message-ID|Content-Type):/mi.test(b2s(u.subarray(0, 2048))) ? 'eml' : null;
}

function build(M) {
  const src = M.html && M.html.trim() ? M.html : M.text != null ? `<pre class="plain">${esc(M.text)}</pre>` : '<p class="none">This message has no displayable body.</p>';
  const d = new DOMParser().parseFromString(src, 'text/html');
  let blocked = 0, missing = 0;
  const cssFix = css => css.replace(/@import[^;]*;?/gi, '').replace(/expression\s*\(/gi, 'x(')
    .replace(/(-moz-binding|behaviou?r)\s*:[^;}]*/gi, '')
    .replace(/url\(\s*(['"]?)\s*([^'")]*?)\s*\1\s*\)/gi, (m, q, u) => {
      const l = u.toLowerCase();
      if (l.startsWith('cid:')) { const x = M.cid.get(l.slice(4)); if (x) return `url("${x}")`; missing++; return 'none'; }
      if (l.startsWith('data:image/')) return m;
      blocked++; return 'none';
    });
  d.querySelectorAll('script,iframe,frame,frameset,object,embed,applet,link,base,form,input,button,select,textarea,noscript,audio,video,source,track,svg,math,meta[http-equiv],style[src]').forEach(x => x.remove());
  d.querySelectorAll('style').forEach(s => s.textContent = cssFix(s.textContent));
  for (const el of d.querySelectorAll('*')) {
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase(), v = a.value.trim(), l = v.replace(/[\u0000-\u0020]/g, '').toLowerCase();
      if (n.startsWith('on') || n === 'srcdoc' || n === 'formaction' || n === 'srcset' || n === 'action') { el.removeAttribute(a.name); continue; }
      if (n === 'style') { el.setAttribute('style', cssFix(v)); continue; }
      if (n === 'href' || n === 'xlink:href') { if (/^(javascript|vbscript|data):/.test(l)) el.removeAttribute(a.name); continue; }
      if (/^(src|background|poster|lowsrc)$/.test(n)) {
        if (l.startsWith('cid:')) { const x = M.cid.get(l.slice(4)); if (x) el.setAttribute(a.name, x); else { el.removeAttribute(a.name); missing++; } continue; }
        if (l.startsWith('data:image/')) continue;
        if (/^(https?:|\/\/|ftp:)/.test(l)) blocked++;
        el.removeAttribute(a.name);
      }
    }
    if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
  }
  const mc = d.createElement('meta'); mc.setAttribute('charset', 'utf-8');
  const cp = d.createElement('meta'); cp.httpEquiv = 'Content-Security-Policy'; cp.content = CSP;
  const st = d.createElement('style');
  st.textContent = 'html,body{margin:0;background:#fff}body{padding:16px 20px;font-family:"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.55;color:#1f2328;overflow-wrap:anywhere}img{max-width:100%;height:auto}pre.plain{white-space:pre-wrap;font-family:Consolas,monospace;margin:0}.none{color:#666;font-style:italic}';
  d.head.prepend(mc, cp, st);
  return {html: '<!DOCTYPE html>' + d.documentElement.outerHTML, blocked, missing};
}

function save(a) {
  const n = (a.name.replace(/[<>:"\/\\|?*\x00-\x1f]/g, '_').slice(0, 180) || 'attachment') + (/\.[^.]+$/.test(a.name) ? '' : (EXT[a.mime] || ''));
  const url = URL.createObjectURL(new Blob([a.data], {type: a.mime || 'application/octet-stream'}));
  const k = E('a'); k.href = url; k.download = n; document.body.append(k); k.click(); k.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function setMsg(kind, msg) {
  const s = $('status'); s.replaceChildren(); s.className = kind ? 'status ' + kind : 'status';
  if (!msg) { s.hidden = true; return; }
  s.hidden = false;
  if (kind === 'loading') s.append(E('span', 'spin'));
  s.append(document.createTextNode(msg));
}
function render(M, f) {
  $('empty').hidden = true; $('viewer').hidden = false; $('fileBar').hidden = false;
  $('fname').textContent = f.name;
  $('fmeta').textContent = `${M.fmt.toUpperCase()} · ${fmtSize(f.size)}`;
  $('subj').textContent = M.subject || '(no subject)';
  $('from').textContent = M.from || '—'; $('to').textContent = M.to || '—';
  $('cc').textContent = M.cc || '—'; $('bcc').textContent = M.bcc || '—'; $('date').textContent = M.date || '—';
  const {html, blocked, missing} = build(M);
  const W = [...M.warnings];
  if (blocked) W.push(`Remote content blocked: ${blocked} external image or resource(s) were not loaded.`);
  if (missing) W.push(`${missing} inline image reference(s) could not be resolved from the message.`);
  const wb = $('warn'); wb.replaceChildren();
  [...new Set(W)].forEach(t => wb.append(E('div', 'warn-item', t)));
  wb.hidden = !W.length;
  $('frame').srcdoc = html;
  const ul = $('atts'); ul.replaceChildren();
  $('acount').textContent = M.atts.length;
  if (!M.atts.length) ul.append(E('li', 'muted', 'No attachments'));
  M.atts.forEach(a => {
    const li = E('li', 'att'), info = E('div', 'att-info');
    const nm = E('div', 'att-name', a.name);
    if (a.inline) nm.append(E('span', 'tag', 'Inline'));
    if (a.embedded) nm.append(E('span', 'tag', 'Embedded'));
    info.append(nm, E('div', 'att-meta', `${a.mime || 'application/octet-stream'} · ${a.data ? fmtSize(a.size) : 'size unknown'}`));
    if (a.note) info.append(E('div', 'att-note', a.note));
    const btn = E('button', 'btn btn-sm', 'Download');
    btn.type = 'button';
    if (a.data) btn.onclick = () => save(a); else btn.disabled = true;
    li.append(info, btn); ul.append(li);
  });
  window.scrollTo(0, 0);
}
async function openFile(f) {
  if (!f) return;
  if (f.size > MAX) { setMsg('error', `"${f.name}" is ${fmtSize(f.size)}, which is above the ${fmtSize(MAX)} limit.`); return; }
  setMsg('loading', `Reading ${f.name} (${fmtSize(f.size)})…`);
  await new Promise(r => setTimeout(r, 30));
  try {
    const u = new Uint8Array(await f.arrayBuffer());
    const ext = (f.name.includes('.') ? f.name.split('.').pop() : '').toLowerCase();
    const fmt = detect(ext, u);
    if (!fmt) { setMsg('warn', `Unsupported file format: "${f.name}". Please choose an .eml, .msg or .oft file.`); return; }
    const w = f.size > LARGE ? [`Large file (${fmtSize(f.size)}): parsing may take a moment.`] : [];
    const M = fmt === 'eml' ? parseEml(u, w) : parseOutlook(u, fmt, w);
    M.fmt = fmt;
    render(M, f);
    setMsg('', '');
  } catch (e) {
    console.error(e);
    setMsg('error', `Could not open "${f.name}": ${e.message || e}`);
  }
}

const dz = $('drop');
['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => {
  const fs = e.dataTransfer.files;
  if (fs.length > 1) setMsg('', 'Multiple files dropped; opening the first one.');
  openFile(fs[0]);
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
$('browse').onclick = () => $('file').click();
dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; openFile(f); };
})();
</script>
